name: urutau_tasks
description: "Urutau Tasks - local-first task manager."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  cryptography: ^2.9.0
  drift: ^2.35.0
  file_selector: ^1.1.0
  drift_flutter: ^0.3.1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_lints: ^6.0.0
  sqlite3: ^3.5.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
